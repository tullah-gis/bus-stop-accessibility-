<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Stop Accessibility — Frankfurt</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; display: flex; height: 100vh; }

  #sidebar {
    width: 300px; background: #f8f9fa; color: #1f2937;
    padding: 20px; display: flex; flex-direction: column;
    gap: 14px; overflow-y: auto; flex-shrink: 0;
    border-right: 1px solid #e5e7eb;
  }

  #sidebar h1 { font-size: 16px; color: #1558d6; letter-spacing: 0.1em; text-transform: uppercase; }
  #sidebar h2 { font-size: 12px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }

  .input-group { display: flex; flex-direction: column; gap: 6px; position: relative; }
  .input-group label { font-size: 13px; color: #6b7280; }
  .input-group input {
    padding: 8px 10px; border-radius: 4px;
    border: 1px solid #d1d5db; background: #ffffff;
    color: #1f2937; font-size: 14px; outline: none;
    transition: border 0.2s;
  }
  .input-group input:focus { border-color: #1558d6; box-shadow: 0 0 0 2px rgba(66,133,244,0.15); }

  /* Autocomplete dropdown */
  #autocomplete-list {
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    background: #ffffff;
    border: 1px solid #1558d6;
    border-top: none;
    border-radius: 0 0 4px 4px;
    z-index: 9999;
    max-height: 200px;
    overflow-y: auto;
    box-shadow: 0 4px 8px rgba(0,0,0,0.08);
  }
  .autocomplete-item {
    padding: 8px 10px;
    font-size: 13px;
    color: #1f2937;
    cursor: pointer;
    border-bottom: 1px solid #e5e7eb;
    line-height: 1.4;
  }
  .autocomplete-item:last-child { border-bottom: none; }
  .autocomplete-item:hover { background: #eff6ff; color: #1558d6; }

  .radius-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .radius-val { color: #1558d6; font-weight: 700; font-size: 16px; }
  input[type=range] { width: 100%; accent-color: #1558d6; margin-top: 4px; }

  .search-btn {
    padding: 10px; background: #1558d6; color: #ffffff;
    border: none; border-radius: 4px; font-weight: 700;
    font-size: 15px; cursor: pointer; transition: background 0.2s;
  }
  .search-btn:hover { background: #3574e2; }
  .search-btn:disabled { background: #d1d5db; color: #9ca3af; cursor: not-allowed; }

  .stat-box { background: #ffffff; border-radius: 6px; padding: 12px; border: 1px solid #e5e7eb; }
  .stat-number { font-size: 32px; font-weight: 700; color: #1558d6; }
  .stat-label { font-size: 13px; color: #6b7280; margin-top: 2px; }

  .stop-list { display: flex; flex-direction: column; gap: 6px; }
  .stop-item {
    background: #ffffff; border-radius: 4px; padding: 10px;
    border-left: 3px solid #1558d6; cursor: pointer;
    transition: background 0.2s; border-top: 1px solid #e5e7eb;
    border-right: 1px solid #e5e7eb; border-bottom: 1px solid #e5e7eb;
  }
  .stop-item:hover { background: #eff6ff; }
  .stop-name { font-size: 14px; font-weight: 600; color: #1f2937; }
  .stop-dist { font-size: 13px; color: #6b7280; margin-top: 2px; }
  .stop-dist span { color: #16a34a; font-weight: 600; }

  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 6px; color: #374151; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .legend-rect { width: 12px; height: 12px; flex-shrink: 0; }

  .status { font-size: 13px; color: #6b7280; text-align: center; padding: 8px; }
  .status.loading { color: #1558d6; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .status.error { color: #e74c3c; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid #d1d5db;
    border-top-color: #1558d6;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  #map { flex: 1; }
</style>
</head>
<body>

<div id="sidebar">
  <h1>Bus Stop Accessibility</h1>
  <p style="font-size:13px;color:#6b7280;">Network-based walking distance · Frankfurt am Main only</p>

  <div>
    <h2>Search</h2>
    <div class="input-group">
      <label>Address in Frankfurt am Main only</label>
      <input type="text" id="address-input"
        placeholder="e.g. Zeil 1, Frankfurt am Main"
        autocomplete="off"/>
      <div id="autocomplete-list" style="display:none;"></div>
    </div>
  </div>

  <div>
    <h2>Walking Radius</h2>
    <div class="radius-row">
      <span>Distance</span>
      <span class="radius-val"><span id="radius-display">300</span>m</span>
    </div>
    <input type="range" id="radius-slider" min="100" max="1000" step="50" value="300"/>
  </div>

  <button class="search-btn" id="search-btn" onclick="runSearch()">Search Bus Stops</button>

  <div id="status" class="status">Enter an address and click search.</div>

  <div id="results-section" style="display:none;">
    <div class="stat-box">
      <div class="stat-number" id="stop-count">0</div>
      <div class="stat-label">Bus stops within walking distance</div>
    </div>

    <div>
      <h2>Stops (sorted by distance)</h2>
      <div class="stop-list" id="stop-list"></div>
    </div>
  </div>

  <div>
    <h2>Legend</h2>
    <div class="legend-row"><div class="legend-dot" style="background:#3498db"></div> Search Point</div>
    <div class="legend-row"><div class="legend-dot" style="background:#f1c40f"></div> Bus Stop</div>
    <div class="legend-row"><div class="legend-rect" style="background:rgba(66,133,244,0.15);border:2px dashed #1558d6"></div> Walking Radius</div>
  </div>
</div>

<div id="map"></div>

<script>
const API = "https://bus-stop-accessibility.onrender.com/api";

const map = L.map("map", { center: [50.1109, 8.6821], zoom: 13 });
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution: "© OpenStreetMap contributors © CARTO"
}).addTo(map);

let searchMarker = null;
let stopsLayer = null;
let isochroneLayer = null;
let autocompleteTimeout = null;
let selectedAddress = null;

// Radius slider
document.getElementById("radius-slider").addEventListener("input", function() {
  document.getElementById("radius-display").textContent = this.value;
});

// Autocomplete
const addressInput = document.getElementById("address-input");
const autocompleteList = document.getElementById("autocomplete-list");

addressInput.addEventListener("input", function() {
  const query = this.value.trim();
  clearTimeout(autocompleteTimeout);
  selectedAddress = null;

  if (query.length < 3) {
    autocompleteList.style.display = "none";
    return;
  }

  // Debounce — warte 400ms nach letztem Tastendruck
  autocompleteTimeout = setTimeout(() => fetchSuggestions(query), 400);
});

async function fetchSuggestions(query) {
  try {
    const url = `https://nominatim.openstreetmap.org/search?` +
      `q=${encodeURIComponent(query + ", Frankfurt am Main")}&` +
      `format=json&limit=5&countrycodes=de&` +
      `viewbox=8.4,50.0,8.9,50.3&bounded=1`;

    const res = await fetch(url, {
      headers: { "Accept-Language": "de" }
    });
    const results = await res.json();

    if (results.length === 0) {
      autocompleteList.style.display = "none";
      return;
    }

    autocompleteList.innerHTML = results.map((r, i) => `
      <div class="autocomplete-item" data-index="${i}"
           data-display="${r.display_name}"
           data-name="${r.display_name}">
        ${r.display_name}
      </div>
    `).join("");

    autocompleteList.style.display = "block";

    // Click on suggestion
    autocompleteList.querySelectorAll(".autocomplete-item").forEach(item => {
      item.addEventListener("click", function() {
        const name = this.dataset.name;
        addressInput.value = name;
        selectedAddress = name;
        autocompleteList.style.display = "none";
        runSearch();
      });
    });

  } catch (err) {
    autocompleteList.style.display = "none";
  }
}

// Close autocomplete when clicking outside
document.addEventListener("click", function(e) {
  if (!addressInput.contains(e.target) && !autocompleteList.contains(e.target)) {
    autocompleteList.style.display = "none";
  }
});

// Enter key
addressInput.addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    autocompleteList.style.display = "none";
    runSearch();
  }
});

async function runSearch() {
  const address = addressInput.value.trim();
  const radius = document.getElementById("radius-slider").value;

  if (!address) return;

  const btn = document.getElementById("search-btn");
  btn.disabled = true;
  btn.textContent = "Searching...";
  setStatus("Calculating network-based accessibility...", "loading");
  document.getElementById("results-section").style.display = "none";
  autocompleteList.style.display = "none";

  try {
    const res = await fetch(`${API}/search?address=${encodeURIComponent(address)}&radius=${radius}`);
    const data = await res.json();

    if (data.error) {
      setStatus(`Error: ${data.error}`, "error");
      return;
    }

    if (searchMarker) map.removeLayer(searchMarker);
    if (stopsLayer) map.removeLayer(stopsLayer);
    if (isochroneLayer) map.removeLayer(isochroneLayer);

    isochroneLayer = L.circle([data.search_point.lat, data.search_point.lon], {
      radius: data.radius_m,
      fillColor: "#1558d6",
      fillOpacity: 0.15,
      color: "#1558d6",
      weight: 2,
    }).addTo(map);

    searchMarker = L.circleMarker([data.search_point.lat, data.search_point.lon], {
      radius: 10, fillColor: "#3498db", color: "#fff", weight: 2, fillOpacity: 1,
    }).addTo(map);
    searchMarker.bindPopup(`<b>Search point</b><br>${address}`).openPopup();

    const features = data.stops.map(stop => ({
      type: "Feature",
      geometry: stop.geometry,
      properties: { name: stop.name, distance_m: stop.distance_m }
    }));

    stopsLayer = L.geoJSON({ type: "FeatureCollection", features }, {
      pointToLayer: (feature, latlng) =>
        L.circleMarker(latlng, {
          radius: 7, fillColor: "#f1c40f", color: "#e67e22",
          weight: 1.5, fillOpacity: 0.9,
        }),
      onEachFeature: (feature, layer) => {
        const p = feature.properties;
        layer.bindTooltip(`<b>${p.name}</b><br>🚶 ${p.distance_m}m walking`, { sticky: true });
      }
    }).addTo(map);

    map.fitBounds(isochroneLayer.getBounds(), { padding: [40, 40] });

    document.getElementById("stop-count").textContent = data.stops_found;
    document.getElementById("results-section").style.display = "block";

    document.getElementById("stop-list").innerHTML = data.stops.map((stop, i) => `
      <div class="stop-item" onclick="flyToStop(${stop.geometry.coordinates[1]}, ${stop.geometry.coordinates[0]})">
        <div class="stop-name">${i + 1}. ${stop.name}</div>
        <div class="stop-dist">🚶 <span>${stop.distance_m}m</span> walking distance</div>
      </div>
    `).join("");

    setStatus(`Found ${data.stops_found} stops within ${radius}m walking distance.`);

  } catch (err) {
    setStatus(`Network error: ${err.message}`, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Search Bus Stops";
  }
}

function flyToStop(lat, lon) {
  map.flyTo([lat, lon], 17, { duration: 1 });
}

function setStatus(msg, type = "") {
  const el = document.getElementById("status");
  el.className = "status " + type;
  if (type === "loading") {
    el.innerHTML = `<div class="spinner"></div><span>${msg}</span>`;
  } else {
    el.textContent = msg;
  }
}
</script>
</body>
</html>
