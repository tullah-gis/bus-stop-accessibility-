<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Stop Accessibility — Frankfurt</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; display: flex; height: 100vh; }
  #sidebar {
    width: 280px; background: #2c3e50; color: #eee;
    padding: 20px; display: flex; flex-direction: column;
    gap: 16px; overflow-y: auto;
  }
  #sidebar h1 { font-size: 14px; color: #f1c40f; letter-spacing: 0.1em; text-transform: uppercase; }
  #sidebar h2 { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .stat-box { background: #34495e; border-radius: 6px; padding: 12px; border: 1px solid #4a6274; }
  .stat-number { font-size: 32px; font-weight: 700; color: #f1c40f; }
  .stat-label { font-size: 11px; color: #aaa; margin-top: 2px; }
  .district-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #4a6274; font-size: 12px; }
  .district-row:last-child { border: none; }
  .district-count { color: #f1c40f; font-weight: 600; }
  .filter-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-btn { padding: 5px 10px; border-radius: 4px; border: 1px solid #4a6274; background: transparent; color: #aaa; font-size: 11px; cursor: pointer; transition: all 0.2s; }
  .filter-btn:hover, .filter-btn.active { border-color: #f1c40f; color: #f1c40f; background: rgba(241,196,15,0.1); }
  .toggle-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 4px 0; }
  .toggle { position: relative; width: 36px; height: 20px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #4a6274; border-radius: 20px; transition: 0.3s; }
  .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background: #aaa; border-radius: 50%; transition: 0.3s; }
  input:checked + .slider { background: rgba(241,196,15,0.3); }
  input:checked + .slider:before { transform: translateX(16px); background: #f1c40f; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 6px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .legend-rect { width: 12px; height: 12px; flex-shrink: 0; }
  #map { flex: 1; }
</style>
</head>
<body>
<div id="sidebar">
  <h1>Bus Stop Accessibility</h1>
  <p style="font-size:11px;color:#aaa;">Frankfurt · Bockenheim, Nordend, Westend, Ostend</p>

  <div class="stat-box">
    <div class="stat-number" id="total-stops">—</div>
    <div class="stat-label">Bus Stops Total</div>
  </div>

  <div>
    <h2>Stops per District</h2>
    <div id="district-stats"></div>
  </div>

  <div>
    <h2>Filter by District</h2>
    <div class="filter-group" id="filters">
      <button class="filter-btn active" data-district="all">All</button>
      <button class="filter-btn" data-district="Bockenheim">Bockenheim</button>
      <button class="filter-btn" data-district="Nordend-West">Nordend-West</button>
      <button class="filter-btn" data-district="Nordend-Ost">Nordend-Ost</button>
      <button class="filter-btn" data-district="Westend-Nord">Westend-Nord</button>
      <button class="filter-btn" data-district="Westend-Süd">Westend-Süd</button>
      <button class="filter-btn" data-district="Ostend">Ostend</button>
    </div>
  </div>

  <div>
    <h2>Layers</h2>
    <div class="toggle-row">
      <span>300m Coverage</span>
      <label class="toggle"><input type="checkbox" id="toggle-coverage" checked><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span>Coverage Gaps</span>
      <label class="toggle"><input type="checkbox" id="toggle-gaps" checked><span class="slider"></span></label>
    </div>
  </div>

  <div>
    <h2>Legend</h2>
    <div class="legend-row"><div class="legend-dot" style="background:#f1c40f"></div> Bus Stop</div>
    <div class="legend-row"><div class="legend-rect" style="background:rgba(39,174,96,0.4);border:2px solid #27ae60"></div> 300m Coverage</div>
    <div class="legend-row"><div class="legend-rect" style="background:rgba(231,76,60,0.35);border:1px solid #e74c3c"></div> Coverage Gap</div>
  </div>
</div>

<div id="map"></div>

<script>
const API = "http://localhost:8000/api";

const map = L.map("map", { center: [50.123, 8.661], zoom: 14 });

// Normaler heller Kartenhintergrund
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution: "© OpenStreetMap contributors",
  maxZoom: 19
}).addTo(map);

let stopsLayer = null;
let coverageLayer = null;
let gapsLayer = null;

async function loadStops(district = null) {
  const url = district && district !== "all"
    ? `${API}/stops?district=${district}`
    : `${API}/stops`;
  const res = await fetch(url);
  const data = await res.json();
  if (stopsLayer) map.removeLayer(stopsLayer);
  stopsLayer = L.geoJSON(data, {
    pointToLayer: (feature, latlng) =>
      L.circleMarker(latlng, {
        radius: 7,
        fillColor: "#f1c40f",
        color: "#e67e22",
        weight: 1.5,
        fillOpacity: 0.9,
      }),
    onEachFeature: (feature, layer) => {
      const p = feature.properties;
      layer.bindTooltip(
        `<b>${p.name || "Unnamed Stop"}</b><br>${p.district}`,
        { sticky: true }
      );
    }
  }).addTo(map);
  document.getElementById("total-stops").textContent = data.features.length;
}

async function loadCoverage() {
  const res = await fetch(`${API}/coverage?radius=300`);
  const data = await res.json();
  if (coverageLayer) map.removeLayer(coverageLayer);
  coverageLayer = L.geoJSON(data, {
    style: {
      fillColor: "#27ae60",
      fillOpacity: 0.35,
      color: "#27ae60",
      weight: 2,
    }
  }).addTo(map);
  if (stopsLayer) stopsLayer.bringToFront();
}

async function loadGaps() {
  const res = await fetch(`${API}/gaps?radius=300`);
  const data = await res.json();
  if (gapsLayer) map.removeLayer(gapsLayer);
  if (!data.geometry) return;
  gapsLayer = L.geoJSON(data, {
    style: {
      fillColor: "#e74c3c",
      fillOpacity: 0.35,
      color: "#e74c3c",
      weight: 1,
    }
  }).addTo(map);
  if (stopsLayer) stopsLayer.bringToFront();
}

async function loadStats() {
  const res = await fetch(`${API}/stats`);
  const data = await res.json();
  document.getElementById("district-stats").innerHTML = data.map(d => `
    <div class="district-row">
      <span>${d.district}</span>
      <span class="district-count">${d.stop_count}</span>
    </div>`).join("");
}

document.getElementById("toggle-coverage").addEventListener("change", e => {
  e.target.checked ? coverageLayer && map.addLayer(coverageLayer) : coverageLayer && map.removeLayer(coverageLayer);
});
document.getElementById("toggle-gaps").addEventListener("change", e => {
  e.target.checked ? gapsLayer && map.addLayer(gapsLayer) : gapsLayer && map.removeLayer(gapsLayer);
});

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    loadStops(btn.dataset.district);
  });
});

loadStops();
loadCoverage();
loadGaps();
loadStats();
</script>
</body>
</html>
